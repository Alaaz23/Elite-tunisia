spring:
  application:
    name: elite-tunisia-api
  profiles:
    default: dev
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/elite_tunisia}
    username: ${DATABASE_USERNAME:elite}
    password: ${DATABASE_PASSWORD:elite_dev_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_IMAGE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

app:
  quotes:
    default-tax-amount: ${QUOTE_DEFAULT_TAX_AMOUNT:0}
    tax-currency: ${QUOTE_TAX_CURRENCY:TND}
    expiration-scan-ms: ${QUOTE_EXPIRATION_SCAN_MS:60000}
  booking:
    time-zone: ${BOOKING_TIME_ZONE:Africa/Tunis}
  security:
    jwt:
      secret: ${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
      access-token-minutes: 15
      refresh-token-days: 30
    secure-cookies: ${SECURE_COOKIES:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200}
  storage:
    local-path: ${STORAGE_LOCAL_PATH:${user.home}/.elite-tunisia/uploads}
    max-image-size-bytes: ${MAX_IMAGE_SIZE_BYTES:10485760}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true