spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
    secure-cookies: true
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}

# La description de l'API (routes, schémas) ne doit pas être publique en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false