spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:elite_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  sql:
    init:
      schema-locations: classpath:schema-test.sql

app:
  test-seed:
    admin: true
  security:
    jwt:
      secret: test-only-secret-key-must-be-at-least-32-bytes
    secure-cookies: false