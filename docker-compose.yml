services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elite_tunisia}
      POSTGRES_USER: ${POSTGRES_USER:-elite}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your local shell}"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - elite-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elite} -d ${POSTGRES_DB:-elite_tunisia}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  elite-postgres-data: